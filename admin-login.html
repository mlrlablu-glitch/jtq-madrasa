<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অ্যাডমিন লগইন - JTQ মাদ্রাসা</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container">
    <div class="login-box">
      <div class="text-center mb-4">
        <i class="fa-solid fa-user-shield fa-3x text-dark mb-2"></i>
        <h4 class="fw-bold">মাদ্রাসা অ্যাডমিন প্যানেল</h4>
        <p class="text-muted small">শুধু মাদ্রাসা কর্তৃপক্ষের ব্যবহারের জন্য</p>
      </div>

      <form id="adminLoginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Admin Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="adminUser" placeholder="admin" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="adminPass" placeholder="পাসওয়ার্ড দিন" required>
          </div>
        </div>

        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
          অ্যাডমিন প্রবেশ <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
        </button>
      </form>

      <div class="text-center mt-4 border-top pt-3">
        <a href="index.html" class="text-decoration-none small text-secondary">
          <i class="fa-solid fa-house me-1"></i> মূল ওয়েবসাইটে ফিরে যান
        </a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value;

      // প্রাথমিক ডেমো অ্যাডমিন পাসওয়ার্ড
      if (user === "admin" && pass === "admin123") {
        localStorage.setItem('adminSession', 'active');
        window.location.href = 'admin-dashboard.html';
      } else {
        alert("ভুল তথ্য! সঠিক তথ্য:\nUser: admin\nPass: admin123");
      }
    });
  </script>
</body>
</html>
