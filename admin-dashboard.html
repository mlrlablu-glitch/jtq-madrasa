<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অ্যাডমিন কন্ট্রোল - JTQ মাদ্রাসা</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fa-solid fa-gauge-high me-2"></i>JTQ মাদ্রাসা অ্যাডমিন কন্ট্রোল
      </a>
      <button class="btn btn-outline-light btn-sm" id="adminLogout">
        <i class="fa-solid fa-right-from-bracket me-1"></i> লগআউট
      </button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4">
      
      <!-- বাম পাশ: ছাত্র ভর্তি, বেতন গ্রহণ ও ফলাফল আপডেট -->
      <div class="col-lg-7">
        
        <!-- নতুন ছাত্র ভর্তি ফরম -->
        <div class="card border-0 shadow-sm p-4 bg-white mb-4">
          <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-user-plus me-2 text-success"></i>পূর্ণাঙ্গ ছাত্র ভর্তি ফরম</h5>
          <form id="addStudentForm">
            
            <div class="row g-3 align-items-center mb-3 p-2 border rounded bg-light">
              <div class="col-auto">
                <img id="imagePreview" src="https://via.placeholder.com/90" class="img-thumbnail rounded" style="width: 85px; height: 95px; object-fit: cover;">
              </div>
              <div class="col">
                <label class="form-label small fw-semibold mb-1">ছাত্রের ছবি আপলোড করুন</label>
                <input type="file" class="form-control form-control-sm" id="studentPhotoInput" accept="image/*" required>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">শিক্ষার্থীর নাম</label>
                <input type="text" class="form-control form-control-sm" id="name" placeholder="শিক্ষার্থীর পুরো নাম" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Student ID</label>
                <input type="text" class="form-control form-control-sm" id="sId" placeholder="যেমন: JTQ-2026-0001" required>
              </div>
            </div>

            <!-- শিক্ষার্থীর নিবন্ধন নম্বর -->
            <div class="row g-2 mb-2">
              <div class="col-md-12">
                <label class="form-label small fw-semibold">শিক্ষার্থীর জন্ম নিবন্ধন / কার্ড নম্বর</label>
                <input type="text" class="form-control form-control-sm" id="studentRegNo" placeholder="জন্ম নিবন্ধন ১৭ ডিজিট নম্বর" required>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">পিতার নাম</label>
                <input type="text" class="form-control form-control-sm" id="father" placeholder="শিক্ষার্থীর পিতার নাম" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">পিতার NID / নিবন্ধন নম্বর</label>
                <input type="text" class="form-control form-control-sm" id="fatherNid" placeholder="শিক্ষার্থীর পিতার ভোটার আইডি / নিবন্ধন নম্বর" required>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">মাতার নাম</label>
                <input type="text" class="form-control form-control-sm" id="mother" placeholder="শিক্ষার্থীর মাতার নাম" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">মাতার NID / নিবন্ধন নম্বর</label>
                <input type="text" class="form-control form-control-sm" id="motherNid" placeholder="মাতার ভোটার আইডি / নিবন্ধন নম্বর" required>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">শিক্ষার্থীর অভিভাবকের মোবাইল নম্বর</label>
                <input type="tel" class="form-control form-control-sm" id="phone" placeholder="017XXXXXXXX" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">জন্ম তারিখ (Date of Birth)</label>
                <input type="date" class="form-control form-control-sm" id="dob" required>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-4">
                <label class="form-label small fw-semibold">বিভাগ / শ্রেণি</label>
                <select class="form-select form-select-sm" id="dept" required>
                  <option value="মক্তব">মক্তব</option>
                  <option value="নূরানী">নূরানী</option>
                  <option value="নাজেরা">নাজেরা</option>
                  <option value="হিফজ বিভাগ">হিফজ বিভাগ</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">শ্রেণি রোল নম্বর</label>
                <input type="number" class="form-control form-control-sm" id="roll" placeholder="০১" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">রক্তের গ্রুপ</label>
                <select class="form-select form-select-sm" id="bloodGroup">
                  <option value="A+">A+</option>
                  <option value="A-">A-</option>
                  <option value="B+">B+</option>
                  <option value="B-">B-</option>
                  <option value="O+">O+</option>
                  <option value="O-">O-</option>
                  <option value="AB+">AB+</option>
                  <option value="AB-">AB-</option>
                  <option value="অজানা">অজানা</option>
                </select>
              </div>
            </div>

            <!-- বর্তমান ঠিকানা -->
            <div class="border rounded p-3 mb-3 bg-light">
              <span class="badge bg-success mb-2">বর্তমান ঠিকানা</span>
              <div class="row g-2">
                <div class="col-md-4"><input type="text" class="form-control form-control-sm" id="preVillage" placeholder="গ্রাম" required></div>
                <div class="col-md-4"><input type="text" class="form-control form-control-sm" id="prePost" placeholder="ডাকঘর" required></div>
                <div class="col-md-4"><input type="text" class="form-control form-control-sm" id="preUnion" placeholder="ইউনিয়ন" required></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-sm" id="preThana" placeholder="থানা" required></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-sm" id="preDistrict" placeholder="জেলা" required></div>
              </div>
            </div>

            <!-- স্থায়ী ঠিকানা -->
            <div class="border rounded p-3 mb-3 bg-light">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-secondary">স্থায়ী ঠিকানা</span>
                <button type="button" class="btn btn-outline-dark btn-sm py-0" style="font-size: 11px;" id="copyAddressBtn">বর্তমান ঠিকানার মতো একই</button>
              </div>
              <div class="row g-2">
                <div class="col-md-4"><input type="text" class="form-control form-control-sm" id="perVillage" placeholder="গ্রাম" required></div>
                <div class="col-md-4"><input type="text" class="form-control form-control-sm" id="perPost" placeholder="ডাকঘর" required></div>
                <div class="col-md-4"><input type="text" class="form-control form-control-sm" id="perUnion" placeholder="ইউনিয়ন" required></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-sm" id="perThana" placeholder="থানা" required></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-sm" id="perDistrict" placeholder="জেলা" required></div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">লগইন পাসওয়ার্ড</label>
              <input type="text" class="form-control form-control-sm" id="sPass" value="jtq@12345" required>
            </div>

            <button type="submit" class="btn btn-success btn-sm w-100 fw-semibold" id="submitBtn">
              ছাত্র ভর্তি সম্পন্ন করুন
            </button>
          </form>
        </div>

        <!-- মাসিক বেতন গ্রহণ ও বকেয়া আপডেট -->
        <div class="card border-0 shadow-sm p-4 bg-white mb-4 border-start border-success border-4">
          <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-money-check-dollar me-2 text-success"></i>শিক্ষার্থীর মাসিক বেতন গ্রহণ ও বকেয়া আপডেট</h5>
          <form id="feePaymentForm">
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Student ID</label>
                <input type="text" class="form-control form-control-sm" id="feeStudentId" placeholder="যেমন: JTQ-2026-0001" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">মাসের নাম</label>
                <select class="form-select form-select-sm" id="feeMonth" required>
                  <option value="জানুয়ারি">জানুয়ারি</option>
                  <option value="ফেব্রুয়ারি">ফেব্রুয়ারি</option>
                  <option value="মার্চ">মার্চ</option>
                  <option value="এপ্রিল">এপ্রিল</option>
                  <option value="মে">মে</option>
                  <option value="জুন">জুন</option>
                  <option value="জুলাই">জুলাই</option>
                  <option value="আগস্ট">আগস্ট</option>
                  <option value="সেপ্টেম্বর">সেপ্টেম্বর</option>
                  <option value="অক্টোবর">অক্টোবর</option>
                  <option value="নভেম্বর">নভেম্বর</option>
                  <option value="ডিসেম্বর">ডিসেম্বর</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">সাল / বছর</label>
                <select class="form-select form-select-sm" id="feeYear" required>
                  <option value="২০২৫">২০২৫</option>
                  <option value="২০২৬" selected>২০২৬</option>
                  <option value="২০২৭">২০২৭</option>
                  <option value="২০২৮">২০২৮</option>
                </select>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">জমার পরিমাণ (টাকা)</label>
                <input type="number" class="form-control form-control-sm" id="feeAmount" placeholder="যেমন: ৫০০" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">পরিশোধের তারিখ</label>
                <input type="date" class="form-control form-control-sm" id="feeDate" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-danger">বর্তমান মোট বকেয়া আপডেট (Remaining Due)</label>
              <input type="text" class="form-control form-control-sm" id="feeRemainingDue" placeholder="যেমন: ০ ৳ বা ৩০০ ৳" required>
            </div>

            <button type="submit" class="btn btn-success btn-sm w-100 fw-semibold" id="feeSubmitBtn">
              বেতন জমা নিশ্চিত করুন ও বকেয়া আপডেট করুন
            </button>
          </form>
        </div>

        <!-- ফলাফল ও উপস্থিতি আপডেট -->
        <div class="card border-0 shadow-sm p-4 bg-white">
          <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>ফলাফল ও উপস্থিতি আপডেট</h5>
          <form id="updateResultForm">
            <div class="mb-2">
              <label class="form-label small fw-semibold">Student ID</label>
              <input type="text" class="form-control form-control-sm" id="academicId" placeholder="টার্গেট Student ID" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">পরীক্ষার ফলাফল / মান</label>
                <input type="text" class="form-control form-control-sm" id="academicRes" placeholder="যেমন: মুমতাজ / A+" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">হাজিরা শতাংশ</label>
                <input type="text" class="form-control form-control-sm" id="academicAtt" placeholder="যেমন: ৯৫%" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm w-100 fw-semibold">ফলাফল ও উপস্থিতি সংরক্ষণ করুন</button>
          </form>
        </div>

      </div>

      <!-- ডান পাশ: ছাত্র তালিকা -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm p-4 bg-white mb-4">
          <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-users me-2 text-primary"></i>শিক্ষার্থী তালিকা</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle small">
              <thead class="table-light">
                <tr>
                  <th>ছবি</th>
                  <th>আইডি</th>
                  <th>বিভাগ</th>
                  <th>বকেয়া</th>
                </tr>
              </thead>
              <tbody id="studentTableBody">
                <tr><td colspan="4" class="text-center text-muted">তথ্য লোড হচ্ছে...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    if (localStorage.getItem('adminSession') !== 'active') {
      window.location.href = 'admin-login.html';
    }

    document.getElementById('adminLogout').addEventListener('click', function() {
      localStorage.removeItem('adminSession');
      window.location.href = 'admin-login.html';
    });

    document.getElementById('feeDate').value = new Date().toISOString().split('T')[0];

    let base64Image = "";
    document.getElementById('studentPhotoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          base64Image = event.target.result;
          document.getElementById('imagePreview').src = base64Image;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('copyAddressBtn').addEventListener('click', function() {
      document.getElementById('perVillage').value = document.getElementById('preVillage').value;
      document.getElementById('perPost').value = document.getElementById('prePost').value;
      document.getElementById('perUnion').value = document.getElementById('preUnion').value;
      document.getElementById('perThana').value = document.getElementById('preThana').value;
      document.getElementById('perDistrict').value = document.getElementById('preDistrict').value;
    });

    db.collection("students").onSnapshot((snapshot) => {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = "";
      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">কোনো রেকর্ড নেই</td></tr>`;
        return;
      }
      snapshot.forEach((doc) => {
        const d = doc.data();
        const photo = d.photo || 'https://via.placeholder.com/40';
        tbody.innerHTML += `
          <tr>
            <td><img src="${photo}" class="rounded-circle" style="width:35px; height:35px; object-fit:cover;"></td>
            <td><strong>${d.studentId}</strong><br><small class="text-muted">${d.name}</small></td>
            <td><span class="badge bg-success">${d.department || '-'}</span></td>
            <td><span class="badge bg-danger">${d.due || '০ ৳'}</span></td>
          </tr>
        `;
      });
    });

    // নতুন ছাত্র ভর্তি (নিবন্ধন ও NID সহ)
    document.getElementById('addStudentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const sId = document.getElementById('sId').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "সংরক্ষণ হচ্ছে...";
      submitBtn.disabled = true;

      const studentData = {
        studentId: sId,
        studentRegNo: document.getElementById('studentRegNo').value.trim(),
        password: document.getElementById('sPass').value,
        name: document.getElementById('name').value.trim(),
        father: document.getElementById('father').value.trim(),
        fatherNid: document.getElementById('fatherNid').value.trim(),
        mother: document.getElementById('mother').value.trim(),
        motherNid: document.getElementById('motherNid').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        dob: document.getElementById('dob').value,
        department: document.getElementById('dept').value,
        roll: document.getElementById('roll').value,
        bloodGroup: document.getElementById('bloodGroup').value,
        photo: base64Image || "https://via.placeholder.com/130",
        presentAddress: {
          village: document.getElementById('preVillage').value.trim(),
          post: document.getElementById('prePost').value.trim(),
          union: document.getElementById('preUnion').value.trim(),
          thana: document.getElementById('preThana').value.trim(),
          district: document.getElementById('preDistrict').value.trim()
        },
        permanentAddress: {
          village: document.getElementById('perVillage').value.trim(),
          post: document.getElementById('perPost').value.trim(),
          union: document.getElementById('perUnion').value.trim(),
          thana: document.getElementById('perThana').value.trim(),
          district: document.getElementById('perDistrict').value.trim()
        },
        admissionDate: new Date().toISOString().split('T')[0],
        attendance: "১০০%",
        result: "অপেক্ষমান",
        due: "০.০০ ৳"
      };

      db.collection("students").doc(sId).set(studentData).then(() => {
        alert("নতুন ছাত্র সফলভাবে ভর্তি করা হয়েছে!");
        this.reset();
        document.getElementById('imagePreview').src = "https://via.placeholder.com/90";
        base64Image = "";
        document.getElementById('sPass').value = "jtq@12345";
      }).catch((err) => {
        alert("ত্রুটি: " + err.message);
      }).finally(() => {
        submitBtn.innerText = "ছাত্র ভর্তি সম্পন্ন করুন";
        submitBtn.disabled = false;
      });
    });

    document.getElementById('feePaymentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const sId = document.getElementById('feeStudentId').value.trim();
      const month = document.getElementById('feeMonth').value;
      const year = document.getElementById('feeYear').value;
      const amount = document.getElementById('feeAmount').value;
      const date = document.getElementById('feeDate').value;
      const remainingDue = document.getElementById('feeRemainingDue').value.trim();
      const btn = document.getElementById('feeSubmitBtn');

      btn.innerText = "জমা হচ্ছে...";
      btn.disabled = true;

      db.collection("students").doc(sId).collection("fee_records").add({
        month: month,
        year: year,
        amount: amount + " ৳",
        date: date,
        timestamp: new Date()
      }).then(() => {
        return db.collection("students").doc(sId).update({
          due: remainingDue
        });
      }).then(() => {
        alert("বেতন জমা এবং বকেয়া আপডেট সফল হয়েছে!");
        document.getElementById('feeAmount').value = "";
        document.getElementById('feeRemainingDue').value = "";
      }).catch((err) => {
        alert("ত্রুটি: " + err.message);
      }).finally(() => {
        btn.innerText = "বেতন জমা নিশ্চিত করুন ও বকেয়া আপডেট করুন";
        btn.disabled = false;
      });
    });

    document.getElementById('updateResultForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('academicId').value.trim();
      db.collection("students").doc(id).update({
        result: document.getElementById('academicRes').value.trim(),
        attendance: document.getElementById('academicAtt').value.trim()
      }).then(() => {
        alert("ফলাফল ও উপস্থিতি আপডেট সফল হয়েছে!");
        this.reset();
      }).catch((err) => {
        alert("আইডি পাওয়া যায়নি: " + err.message);
      });
    });
  </script>
</body>
</html>
