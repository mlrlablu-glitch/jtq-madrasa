<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শিক্ষক লগইন-JTQIM-জামিয়া তাসলিমুল কুরআন ইসলামিয়া মাদ্রাসা</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #062c19, #0f5132);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 100%;
      padding: 30px;
    }
    /* অটো-সাজেশন ড্রপডাউন স্টাইল */
    .autocomplete-list {
      position: absolute;
      border: 1px solid #d4d4d4;
      border-bottom: none;
      border-top: none;
      z-index: 99;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background-color: #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 0 0 6px 6px;
    }
    .autocomplete-item {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #d4d4d4;
      font-size: 13.5px;
      color: #212529;
    }
    .autocomplete-item:hover {
      background-color: #e9ecef;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="mb-2 text-success">
        <i class="fa-solid fa-chalkboard-user fa-3x"></i>
      </div>
      <h4 class="fw-bold text-dark">শিক্ষক পোর্টাল লগইন</h4>
      <p class="text-muted small">দৈনিক সবক ও পাঠদান তথ্য এন্ট্রি করতে লগইন করুন</p>
    </div>

    <form id="teacherLoginForm">
      <div class="mb-3 position-relative">
        <label class="form-label small fw-semibold">শিক্ষক আইডি (Teacher ID)</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
          <input type="text" class="form-control fw-bold text-success" id="tId" placeholder="ID বা নাম লিখে খুঁজুন..." autocomplete="off" required>
        </div>
        <!-- অটো-ফিল্টার ড্রপডাউন লিস্ট -->
        <div id="autocompleteResults" class="autocomplete-list" style="display: none;"></div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">শিক্ষক পাসওয়ার্ড</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="tPass" placeholder="পাসওয়ার্ড লিখুন" required>
        </div>
        <small class="text-muted" style="font-size: 11px;">ডিফল্ট পাসওয়ার্ড: <strong>teacher@123</strong></small>
      </div>

      <button type="submit" class="btn btn-success w-100 fw-semibold py-2 shadow-sm" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket me-1"></i> লগইন করুন
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="index.html" class="text-decoration-none small text-muted">
        <i class="fa-solid fa-house me-1"></i> মূল ওয়েবসাইটে ফিরে যান
      </a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    const tIdInput = document.getElementById('tId');
    const autocompleteList = document.getElementById('autocompleteResults');
    let allTeachers = [];

    // ফায়ারবেস থেকে শিক্ষকদের তালিকা লোড করা
    function loadTeachersForAutocomplete() {
      allTeachers = [];
      db.collection("teachers").get().then((snapshot) => {
        snapshot.forEach((doc) => {
          let data = doc.data();
          allTeachers.push({
            id: data.teacherId || doc.id,
            name: data.nameBn || data.name || "নাম নেই"
          });
        });
      }).catch(err => console.log(err));
    }

    window.addEventListener('DOMContentLoaded', loadTeachersForAutocomplete);

    // টাইপ করার সাথে সাথে ফিল্টার করে সাজেশান দেখানো
    tIdInput.addEventListener('input', function() {
      const val = this.value.trim().toLowerCase();
      autocompleteList.innerHTML = '';
      if (!val) { autocompleteList.style.display = 'none'; return; }

      const filtered = allTeachers.filter(item => {
        return String(item.id).toLowerCase().includes(val) || String(item.name).toLowerCase().includes(val);
      });

      if (filtered.length === 0) { autocompleteList.style.display = 'none'; return; }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'autocomplete-item';
        div.innerHTML = `<strong>${item.id}</strong> - ${item.name}`;
        div.addEventListener('click', function() {
          tIdInput.value = item.id;
          autocompleteList.style.display = 'none';
        });
        autocompleteList.appendChild(div);
      });
      autocompleteList.style.display = 'block';
    });

    document.addEventListener('click', function(e) {
      if (e.target !== tIdInput) autocompleteList.style.display = 'none';
    });

    // ফায়ারবেস থেকে শিক্ষক আইডি ও পাসওয়ার্ড যাচাই লজিক
    document.getElementById('teacherLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const tId = tIdInput.value.trim();
      const pass = document.getElementById('tPass').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerText = "যাচাই করা হচ্ছে...";

      try {
        const docRef = await db.collection("teachers").doc(tId).get();
        let teacherDoc = docRef;
        let tData = docRef.exists ? docRef.data() : null;

        if (!tData) {
          const qSnap = await db.collection("teachers").where("teacherId", "==", tId).get();
          if (!qSnap.empty) {
            tData = qSnap.docs[0].data();
          }
        }

        if (!tData) {
          alert("এই শিক্ষক আইডি দিয়ে কোনো শিক্ষক নিবন্ধিত নেই!");
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-1"></i> লগইন করুন`;
          return;
        }

        const storedPass = tData.password || "teacher@123";

        if (pass === storedPass) {
          localStorage.setItem('teacherSession', 'active');
          localStorage.setItem('teacherId', tId);
          localStorage.setItem('teacherName', tData.nameBn || tData.name || "");
          localStorage.setItem('teacherPhone', tData.phone || "");
          window.location.href = 'daily-sabak.html';
        } else {
          alert("ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড প্রদান করুন।");
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-1"></i> লগইন করুন`;
        }
      } catch (err) {
        alert("ত্রুটি: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-1"></i> লগইন করুন`;
      }
    });
  </script>
</body>
</html>
