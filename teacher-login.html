<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শিক্ষক / উস্তাদজি লগইন - JTQ মাদ্রাসা</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #062c19, #0f5132);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 100%;
      padding: 30px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="mb-2 text-success">
        <i class="fa-solid fa-chalkboard-user fa-3x"></i>
      </div>
      <h4 class="fw-bold text-dark">শিক্ষক পোর্টাল লগইন</h4>
      <p class="text-muted small">দৈনিক সবক ও পাঠদান তথ্য এন্ট্রি করতে লগইন করুন</p>
    </div>

    <form id="teacherLoginForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">শিক্ষক আইডি (Teacher ID)</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
          <input type="text" class="form-control fw-bold text-success" id="tId" placeholder="যেমন: TCH-01" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">শিক্ষক পাসওয়ার্ড</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="tPass" placeholder="পাসওয়ার্ড লিখুন" required>
        </div>
        <small class="text-muted" style="font-size: 11px;">ডিফল্ট পাসওয়ার্ড: <strong>teacher@123</strong></small>
      </div>

      <button type="submit" class="btn btn-success w-100 fw-semibold py-2 shadow-sm" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket me-1"></i> লগইন করুন
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="index.html" class="text-decoration-none small text-muted">
        <i class="fa-solid fa-house me-1"></i> মূল ওয়েবসাইটে ফিরে যান
      </a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    // ফায়ারবেস থেকে শিক্ষক আইডি ও পাসওয়ার্ড যাচাই লজিক
    document.getElementById('teacherLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const tId = document.getElementById('tId').value.trim();
      const pass = document.getElementById('tPass').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerText = "যাচাই করা হচ্ছে...";

      try {
        const docRef = await db.collection("teachers").doc(tId).get();
        if (!docRef.exists) {
          alert("এই শিক্ষক আইডি দিয়ে কোনো শিক্ষক নিবন্ধিত নেই!");
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-1"></i> লগইন করুন`;
          return;
        }

        const tData = docRef.data();
        const storedPass = tData.password || "teacher@123";

        if (pass === storedPass) {
          localStorage.setItem('teacherSession', 'active');
          localStorage.setItem('teacherId', tId);
          localStorage.setItem('teacherName', tData.name);
          localStorage.setItem('teacherPhone', tData.phone || "");
          window.location.href = 'daily-sabak.html';
        } else {
          alert("ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড প্রদান করুন।");
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-1"></i> লগইন করুন`;
        }
      } catch (err) {
        alert("ত্রুটি: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-1"></i> লগইন করুন`;
      }
    });
  </script>
</body>
</html>
